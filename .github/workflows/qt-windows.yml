# Build a Qt project on Windows
name: Build on Windows

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v6
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        cache: true
        version: '5.12.12'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2017_64'
        install-deps: true
        modules: 'qtwebengine'
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
        sdk: 10.0.22621.0

    - name: Cache GStreamer
      id: cache-gstreamer
      uses: actions/cache@v4
      with:
        path: C:\Program Files\gstreamer
        key: gstreamer-1.0-msvc-x86_64
    - name: Install GStreamer
      if: steps.cache-gstreamer.outputs.cache-hit != 'true'
      run: choco install gstreamer gstreamer-devel -y
    - name: Set GStreamer env
      run: echo "GSTREAMER_1_0_ROOT_X86=C:\Program Files\gstreamer\1.0\msvc_x86_64" >> $env:GITHUB_ENV

    - name: qmake
      run: qmake . -spec win32-msvc
    - name: make
      run: nmake
    - name: make check
      run: nmake check

    - name: List files
      run: ls -la

    - uses: actions/upload-artifact@v7
      with:
        path: mapmap*


