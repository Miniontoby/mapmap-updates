# Build a Qt project on Windows
name: Build on Windows

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v6
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.12.12'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2017_64'
        install-deps: true
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: qmake
      run: qmake .
    - name: make
      run: make
    - name: make check
      run: make check

    - name: List files
      run: ls -la

    - uses: actions/upload-artifact@v4
      with:
        path: mapmap*


#    - name: make distcheck
#      run: make distcheck
