# Build a Qt project on Ubuntu
name: Build on Ubuntu (old)

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        cache: true
        version: '5.12.12'
        host: 'linux'
        target: 'desktop'
        install-deps: true
        modules: 'qtwebengine'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          liblo-dev liblo-tools \
          qtwebengine5-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          gstreamer1.0-plugins-bad \
          gstreamer1.0-libav \
          gstreamer1.0-vaapi \
          gstreamer1.0-plugins-base \
          gstreamer1.0-plugins-base-apps \
          gstreamer1.0-plugins-good \
          gstreamer1.0-plugins-ugly \
          gstreamer1.0-x \
          gstreamer1.0-tools 

    - name: qmake
      run: qmake .
    - name: make
      run: make
    - name: make check
      run: make check

    - uses: actions/upload-artifact@v7
      with:
        name: linux-build
        path: mapmap

#    - name: make distcheck
#      run: make distcheck
