# Build a Qt project on Ubuntu
name: Build on Ubuntu (old)

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    if: false # Disable for now

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        cache: true
        version: '5.12.12'
        host: 'linux'
        target: 'desktop'
        install-deps: true
    - name: qmake
      run: qmake .
    - name: make
      run: make
    - name: make check
      run: make check

#    - name: make distcheck
#      run: make distcheck
