# Build a Qt project on macOS
name: Build on macOS

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        cache: true
        version: '5.12.12'
        host: 'mac'
        target: 'desktop'
        install-deps: true
        modules: 'qtwebengine'

    - name: install pkg config
      run: |
        brew install pkg-config

    - name: Install QT
      run: |
        brew install qt@5
        QT5_PREFIX="$(brew --prefix qt@5)"
        echo "QT5_PREFIX="${QT5_PREFIX}"" >> $env:GITHUB_ENV
        echo "PATH="${QT5_PREFIX}/bin:${PATH}"" >> $env:GITHUB_ENV
        echo "Qt 5 prefix: ${QT5_PREFIX}"
        echo "qmake: $(command -v qmake)"
        qmake --version

    - name: install deps
      run: |
        brew install  \
          gstreamer \
          gst-plugins-base \
          gst-plugins-good \
          gst-plugins-bad \
          gst-plugins-ugly \
          gst-libav

    - name: expose gstreamer
      run: |
        GST_PREFIX="$(brew --prefix gstreamer)"
        echo "GST_PREFIX="${GST_PREFIX}"" >> $env:GITHUB_ENV
        PKG_CONFIG_PATH="${GST_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
        echo "PKG_CONFIG_PATH="${PKG_CONFIG_PATH:-}"" >> $env:GITHUB_ENV
        echo "GStreamer prefix: ${GST_PREFIX}"
        echo "GStreamer version: $(pkg-config --modversion gstreamer-1.0)"

    - name: qmake
      run: qmake .

    - name: make
      run: make -j"$(sysctl -n hw.logicalcpu)"

    - name: make check
      run: make check

    - uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: mapmap

#    - name: make distcheck
#      run: make distcheck
